<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDON Reborn Motion Library</title>
<style>
  :root { color-scheme: dark; font: 14px system-ui, sans-serif; color:#edf1f7; background:#10141c; }
  * { box-sizing:border-box; }
  body { margin:0; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 22px; border-bottom:1px solid #34415a; }
  h1 { font-size:22px; letter-spacing:-.04em; margin:0; }
  h2 { font-size:14px; margin:0; }
  main { display:grid; grid-template-columns:minmax(260px,365px) 1fr; min-height:calc(100vh - 60px); }
  aside { padding:16px; background:#161d29; border-right:1px solid #34415a; }
  input,button,select { font:inherit; color:inherit; border:1px solid #46546b; background:#202a39; border-radius:6px; padding:7px 9px; }
  button:not(:disabled) { cursor:pointer; } button:disabled { opacity:.5; }
  button.primary { color:#211509; background:#ffbd71; border-color:#ffbd71; font-weight:700; }
  input:focus-visible, button:focus-visible, select:focus-visible { outline:2px solid #ffbd71; outline-offset:2px; }
  [hidden] { display:none !important; }
  .library-tabs { display:flex; gap:6px; margin-bottom:14px; }
  .library-tabs button[aria-pressed=true] { border-color:#ffbd71; }
  #effects-library select { max-width:100%; }
  #effect-choice { width:100%; margin-bottom:8px; }
  #effect-status { min-height:1.4em; color:#adb9cd; overflow-wrap:anywhere; }
  .filters { display:grid; grid-template-columns:1fr 1.4fr; gap:8px; margin-top:10px; }
  #vocation, #search { grid-column:1/-1; width:100%; }
  #results { display:flex; flex-direction:column; gap:4px; margin:10px 0; max-height:43vh; min-height:80px; overflow:auto; }
  .row { width:100%; text-align:left; overflow-wrap:anywhere; padding:7px 8px; }
  .row[aria-pressed=true] { border-color:#ffbd71; }
  .asset-id { display:block; color:#adb9cd; font-size:.78rem; margin-top:3px; }
  .list-nav { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .muted, #status { color:#adb9cd; }
  #selection { padding-top:14px; margin-top:14px; border-top:1px solid #34415a; }
  #selection select:not([hidden]) { display:block; width:100%; margin:8px 0; }
  #actions, .sequence-actions { display:flex; flex-wrap:wrap; gap:6px; }
  #sequence-list { padding-left:26px; max-height:18rem; overflow-y:auto; }
  #sequence-list li { margin:5px 0; }
  #sequence-list button { margin-left:5px; padding:2px 6px; }
  #status { min-height:1.4em; margin-top:8px; }
  details { padding-top:12px; margin-top:12px; border-top:1px solid #34415a; }
  summary { cursor:pointer; }
  .settings { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:10px 0; }
  .settings label { display:flex; flex-direction:column; gap:5px; min-width:0; }
  .settings label[hidden] { display:none; }
  #outfit, #scene-items { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; }
  #gear-search, #gear-results, #gear-member { width:100%; margin-bottom:8px; }
  #gear-slot-field { grid-column:1/-1; }
  #gear-palette-field:not([hidden]) { display:grid; gap:5px; margin:8px 0; }
  #gear-palette { width:100%; }
  .token { padding:4px 6px; overflow-wrap:anywhere; }
  .viewer { min-width:0; }
  .gear-feedback:not([hidden]) { display:flex; align-items:center; gap:8px; }
  #gear-feedback { margin:8px 0; color:#b9e8ff; overflow-wrap:anywhere; }
  #gear-feedback[data-state="error"] { color:#ffc1a8; }
  .gear-spinner { width:14px; height:14px; flex:0 0 14px; border:2px solid #52627b;
    border-top-color:#92dcff; border-radius:50%; animation:gear-spin .8s linear infinite; }
  @keyframes gear-spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .gear-spinner { animation:none; } }
  #viewer-gear-progress { position:sticky; top:12px; height:0; z-index:1; justify-content:flex-end;
    align-items:flex-start; pointer-events:none; margin:0 16px; }
  #viewer-gear-progress > span { display:flex; align-items:center; gap:9px; padding:9px 12px;
    border:1px solid #52627b; border-radius:6px; background:#202a39; color:#edf1f7; }
  #viewer-empty { padding:28px clamp(14px, 3vw, 42px); }
  iframe:not([hidden]) { width:100%; height:max(620px,calc(100vh - 67px)); border:0; display:block; background:#10141c; }
  @media (max-width:740px) {
    main { grid-template-columns:1fr; }
    aside { border-right:0; border-bottom:1px solid #34415a; }
    #results { max-height:225px; }
  }
</style>
<header><h1>DDON Reborn Motion Library <small>Beta</small></h1></header>
<main>
  <aside>
    <nav class="library-tabs" aria-label="Preview library">
      <button id="animations-tab" aria-controls="animations-library" aria-pressed="true" type="button">Animations</button>
      <button id="effects-tab" aria-controls="effects-library" aria-pressed="false" type="button">Effects</button>
    </nav>
    <div id="animations-library">
    <h2>Installed asset catalog</h2>
    <div class="filters">
      <select id="game" aria-label="Game"><option value="">Both games</option><option>DDON</option><option>DD2</option></select>
      <select id="kind" aria-label="Asset category">
        <option value="animation">Animations</option><option value="appearance">Character parts</option>
        <option value="armor">Armor</option><option value="weapon">Weapons</option>
        <option value="model">DDON models</option><option value="target">DD2 targets</option><option value="">All assets</option>
      </select>
      <select id="vocation" aria-label="DDON vocation"><option value="">All vocations</option></select>
      <input id="search" type="search" placeholder="Search names or asset IDs" aria-label="Search assets">
    </div>
    <div id="results"></div>
    <div class="list-nav"><button id="previous">Previous</button><span id="count" class="muted"></span><button id="next">Next</button></div>
    <section id="selection" hidden>
      <h2 id="title"></h2>
      <select id="member" aria-label="Archive member"></select>
      <select id="clip" aria-label="Animation clip" hidden></select>
      <div id="actions"></div>
      <details id="sequence" hidden>
        <summary>Clip sequence</summary>
        <ol id="sequence-list"></ol>
        <div class="sequence-actions">
          <button id="sequence-add" type="button">Add selected clip</button>
          <button id="sequence-load" type="button" disabled>Load sequence</button>
          <button id="preview-single-clip" type="button" hidden>Preview selected clip</button>
        </div>
      </details>
      <label id="motion-effect-field" hidden>Motion effect
        <select id="motion-effect" aria-label="Motion effect"></select>
      </label>
      <div id="status" role="status"></div>
    </section>
    <details id="equipment">
      <summary>Equipment</summary>
      <div class="settings">
        <label>Character <select id="gear-game"><option value="DDON">DDON source</option><option value="DD2">DD2 target</option></select></label>
        <label>Type <select id="gear-kind"><option value="weapon">Weapons</option><option value="armor">Armor</option></select></label>
        <label id="gear-slot-field"><span id="gear-slot-label">Weapon type</span>
          <select id="gear-slot"><option value="">All weapon types</option></select>
        </label>
      </div>
      <input id="gear-search" type="search" placeholder="Search equipment name or ID" aria-label="Search equipment">
      <select id="gear-results" aria-label="Equipment results" size="5"></select>
      <div class="list-nav"><button id="gear-previous">Previous</button><span id="gear-count" class="muted" role="status"></span><button id="gear-next">Next</button></div>
      <select id="gear-member" aria-label="Equipment model" hidden></select>
      <label id="gear-palette-field" hidden>DD2 color variant <select id="gear-palette"></select></label>
      <div id="gear-feedback" class="gear-feedback" role="status" hidden>
        <span id="gear-feedback-spinner" class="gear-spinner" aria-hidden="true"></span>
        <span id="gear-feedback-text"></span>
      </div>
      <div class="settings">
        <label id="gear-set-field" hidden>Armor set <select id="gear-set"></select></label>
      </div>
      <div class="sequence-actions">
        <button id="clear-armor" type="button">Clear armor</button>
        <button id="clear-weapon" type="button">Clear weapon</button>
        <button id="restore-gear" type="button">Restore defaults</button>
      </div>
      <div id="outfit"></div>
    </details>
    <details open>
      <summary>Character setup</summary>
      <div class="settings">
        <label>DDON character <select id="ddon-character"><option value="base">Default male</option><option value="female">Default female</option></select></label>
        <label>DD2 character <select id="dd2-character"><option value="base">Base player</option></select></label>
        <label>DD2 body <select id="body"><option value="male">Male</option><option value="female">Female</option></select></label>
        <label>Height scale <input id="height" type="number" min=".65" max="1.45" step=".05" value="1"></label>
      </div>
      <label><input id="feet" type="checkbox" checked> Reconstruct DDON foot markers</label>
      <label><input id="test-armor" type="checkbox" checked> Wear armor</label>
    </details>
    <details id="target-fx">
      <summary>Target and FX</summary>
      <div id="scene-items"></div>
      <div class="settings">
        <label>Target distance <input id="distance" type="number" min=".3" max="4" step=".1" value="1.3"></label>
        <label>Attach on sample <input id="hit" type="number" min="0" step="1" value="12"></label>
        <label>Source event marker <select id="source-event"><option value="">Manual sample</option></select></label>
        <label id="effect-field" hidden>Archive FX mesh <select id="effect"><option value="">Off</option></select></label>
        <label>Attachment height <input id="anchor" type="number" min="0" max="1" step=".05" value=".65"></label>
        <label>Object scale <input id="object-scale" type="number" min=".05" max="2" step=".05" value=".3"></label>
        <label>Target joint <select id="joint"><option value="">Height marker</option></select></label>
      </div>
      <small id="fx-status" class="muted">Select an animation to check for FX meshes.</small>
    </details>
    </div>
    <section id="effects-library" hidden>
      <h2>Effect library</h2>
      <div class="settings">
        <label>Game <select id="effect-game"><option value="">Both games</option><option>DDON</option><option>DD2</option></select></label>
      </div>
      <select id="effect-choice" aria-label="Effect" size="5"></select>
      <small id="effect-source" class="muted"></small>
      <div class="settings">
        <label>Placement
          <select id="effect-anchor"><option value="body">Character center</option><option value="hand">Right hand</option>
            <option value="ground">Ground</option><option value="target">Selected target</option></select>
        </label>
        <label>Trigger
          <select id="effect-trigger"><option value="action">Action start</option><option value="marker">Target and FX marker</option></select>
        </label>
      </div>
      <p id="effect-motion" class="muted"></p>
      <div class="sequence-actions">
        <button id="play-effect" type="button">Play effect</button>
        <button id="play-effect-motion" type="button" class="primary">Play with motion</button>
      </div>
      <p id="effect-status" role="status"></p>
    </section>
  </aside>
  <section class="viewer">
    <div id="viewer-gear-progress" class="gear-feedback" aria-hidden="true" hidden>
      <span><span class="gear-spinner"></span><span id="viewer-gear-progress-text"></span></span>
    </div>
    <p id="viewer-empty" class="muted" role="status">Select a DDON player animation to compare it with its DD2 retarget.</p>
    <iframe id="viewer" title="Motion preview" hidden></iframe>
  </section>
</main>
<script>
  'use strict';
  const $ = id => document.getElementById(id);
  const selected = { asset: null, clips: [], sequence: [], activeSequence: [], playAll: false };
  const setup = {wear: [], armorSet: {}, clearArmor: {}, clearWeapon: {}};
  let armorSets = null;
  const slots = {
    rig: 'DDON rig', head: 'DD2 head', weapon_ddon: 'DDON weapon', weapon_dd2: 'DD2 weapon',
    mob: 'Target', object: 'Attached object', mob_motion: 'Target motion'
  };
  let page = 0, total = 0, searchTimer, searchVersion = 0, selectionVersion = 0, previewVersion = 0, lastURL;
  let gearPage = 0, gearVersion = 0, gearMemberVersion = 0, gearTimer, gearRows = [];
  let pendingPreview, gearUpdate, gearPalettes = [];
  const vfx = {items: null, open: false, layer: null};
  function url(route, params) { return route + '?' + params.toString(); }
  async function api(route, params) {
    const response = await fetch(url(route, params));
    const data = await response.json();
    if (!response.ok) throw Error(data.error || response.statusText);
    return data;
  }
  const describe = item => {
    if (!item) return '';
    if (item.label) return item.label;
    const resource = item.name.split('/').pop();
    if (item.shared) return 'Shared mesh · ' + item.aliases[0];
    return item.type_label ? item.type_label + ' · ' + resource : resource;
  };
  function action(label, run, primary = false) {
    const button = document.createElement('button');
    button.textContent = label;
    if (primary) button.className = 'primary';
    button.addEventListener('click', run);
    return button;
  }
  function message(value) { $(vfx.open ? 'effect-status' : 'status').textContent = value; }
  function syncEffectControls() {
    const item = vfx.items?.find(row => row.id === $('effect-choice').value);
    const motion = selected.asset?.kind === 'animation' && Boolean($('clip').value) && !$('clip').hidden;
    $('effect-source').textContent = item?.source || '';
    $('effect-motion').textContent = motion
      ? 'Motion: ' + describe(selected.asset) : 'Select an animation in the Animations tab to play it with an effect.';
    $('play-effect').disabled = !item;
    $('play-effect-motion').disabled = !item || !motion;
    $('motion-effect-field').hidden = !motion;
    const choice = $('motion-effect');
    choice.value = vfx.layer?.id || (selected.spriteOff ? 'off' : 'auto');
    if (choice.value === '') choice.value = 'auto';
    $('effect-anchor').querySelector('[value="target"]').disabled = !setup.mob;
    if (!setup.mob && $('effect-anchor').value === 'target') $('effect-anchor').value = 'body';
    return item;
  }
  function showEffectChoices() {
    const choice = $('effect-choice');
    const previous = choice.value;
    const game = $('effect-game').value;
    options(choice, (vfx.items || []).filter(row => !game || row.game === game)
      .map(row => ({name: row.game + ' · ' + row.name, key: row.id})));
    if ([...choice.options].some(option => option.value === previous)) choice.value = previous;
    else choice.selectedIndex = choice.options.length ? 0 : -1;
    syncEffectControls();
  }
  async function openEffects() {
    vfx.open = true;
    $('animations-tab').setAttribute('aria-pressed', 'false');
    $('effects-tab').setAttribute('aria-pressed', 'true');
    $('animations-library').hidden = true;
    $('effects-library').hidden = false;
    syncEffectControls();
    try {
      if (!vfx.items) vfx.items = await api('/api/effects', new URLSearchParams());
      if (!vfx.open) return;
      showEffectChoices();
      loadPreview({solo: true});
    } catch (error) {
      if (vfx.open) message(error.message);
    }
  }
  $('effects-tab').addEventListener('click', openEffects);
  $('animations-tab').addEventListener('click', () => {
    if (!vfx.open) return;
    vfx.open = false;
    cancelPreview();
    $('animations-tab').setAttribute('aria-pressed', 'true');
    $('effects-tab').setAttribute('aria-pressed', 'false');
    $('animations-library').hidden = false;
    $('effects-library').hidden = true;
    syncEffectControls();
    if (selected.asset && (selected.asset.kind !== 'animation' || $('clip').value)) loadPreview();
    else {
      $('viewer').hidden = true;
      $('viewer-empty').hidden = false;
      $('viewer-empty').textContent = 'Select a DDON player animation to compare it with its DD2 retarget.';
    }
  });
  $('effect-game').addEventListener('change', () => {
    showEffectChoices();
    loadPreview({solo: true});
  });
  $('effect-choice').addEventListener('change', () => {
    syncEffectControls();
    loadPreview({solo: true});
  });
  $('play-effect').addEventListener('click', () => loadPreview({solo: true, autoplay: true}));
  $('play-effect-motion').addEventListener('click', () => {
    const effect = syncEffectControls();
    if (!effect) return;
    vfx.layer = {...effect, anchor: $('effect-anchor').value, trigger: $('effect-trigger').value};
    loadPreview({autoplay: true});
  });
  $('motion-effect').addEventListener('change', () => {
    const value = $('motion-effect').value;
    const option = selected.spriteChoices.find(item => item.id === value);
    vfx.layer = option ? {...option, anchor: option.anchor || 'body', trigger: 'action'} : null;
    selected.spriteOff = value === 'off';
    $('effect').value = value === 'auto' && !selected.defaultEffect && !$('effect-field').hidden ? '0' : '';
    loadPreview({samePose: true});
  });
  function cancelPreview() {
    ++previewVersion;
    pendingPreview?.abort();
    pendingPreview = null;
  }
  function options(node, rows) {
    node.replaceChildren(...rows.map(row => {
      const entry = new Option(row.name, row.key);
      entry.disabled = row.key === '';
      return entry;
    }));
  }
  function showGearFeedback(text, state) {
    $('gear-feedback-text').textContent = text;
    $('gear-feedback').dataset.state = state;
    $('gear-feedback').hidden = !text;
    const loading = state === 'loading';
    $('gear-feedback-spinner').hidden = !loading;
    $('viewer-gear-progress').hidden = !loading;
    $('viewer-gear-progress-text').textContent = loading ? text : '';
  }
  function beginGearUpdate(item) {
    const update = {game: item.game, name: describe(item), target: item.game === 'DD2' ? 'DD2 target' : 'DDON source'};
    gearUpdate = update;
    showGearFeedback('Loading ' + update.name + ' on the ' + update.target + '…', 'loading');
    return update;
  }
  function finishGearUpdate(update, error) {
    if (!update || update !== gearUpdate) return;
    gearUpdate = null;
    if (error) showGearFeedback('Could not load ' + update.name + '. ' + error, 'error');
    else showGearFeedback(update.name + ' loaded on the ' + update.target + '.', 'ready');
  }
  function refreshOutfit() {
    updateTokens();
    if (selected.asset?.kind === 'animation' && !$('clip').hidden) loadPreview({samePose: true});
  }
  function equip(item, member, name, update = beginGearUpdate(item)) {
    update.building = true;
    const piece = {...item, member, name: name || item.name};
    if (item.kind === 'weapon') {
      setup['weapon_' + item.game.toLowerCase()] = piece;
      setup.clearWeapon[item.game] = false;
    } else {
      setup.wear = setup.wear.filter(worn => worn.id !== piece.id &&
        !(item.slot && worn.game === item.game && worn.slot === item.slot));
      setup.wear.push(piece);
    }
    previewGear(item.game);
  }
  function previewGear(game) {
    const motion = selected.asset?.kind === 'animation';
    const playerMotion = $('member').selectedOptions[0]?.textContent.toLowerCase().startsWith('obj/pl/pl000000/');
    const comparison = selected.asset?.id === 0 || (playerMotion && !setup.rig);
    if (!motion || (!comparison && (selected.asset.game !== 'DD2' || game !== 'DD2'))) {
      setup.rig = null;
      updateTokens();
      select({id: 0, game: 'DDON', kind: 'animation', name: 'Fighter attack study'});
    } else {
      refreshOutfit();
    }
  }
  function renderArmorSets() {
    const game = $('gear-game').value;
    const savedBody = $('dd2-character').value === 'saved';
    const sets = (armorSets || []).filter(set => set.game === game && (!set.body || savedBody || set.body === $('body').value));
    $('gear-set-field').hidden = sets.length === 0;
    $('gear-set').replaceChildren(new Option('Choose an armor set', ''), ...sets.map(set =>
      new Option(set.name + ' · ' + set.count + ' pieces', set.id)));
    $('gear-set').value = sets.some(set => set.id === setup.armorSet[game]) ? setup.armorSet[game] : '';
  }
  function changeGear(game, armor, weapon, restore = false) {
    ++gearMemberVersion;
    gearUpdate = null;
    showGearFeedback('', '');
    if (armor) {
      setup.wear = setup.wear.filter(piece => piece.game !== game || piece.kind !== 'armor');
      delete setup.armorSet[game];
      setup.clearArmor[game] = !restore;
    }
    if (weapon) {
      setup['weapon_' + game.toLowerCase()] = null;
      setup.clearWeapon[game] = !restore;
    }
    renderArmorSets();
    previewGear(game);
  }
  $('clear-armor').addEventListener('click', () => changeGear($('gear-game').value, true, false));
  $('clear-weapon').addEventListener('click', () => changeGear($('gear-game').value, false, true));
  $('restore-gear').addEventListener('click', () => changeGear($('gear-game').value, true, true, true));
  $('gear-set').addEventListener('change', () => {
    const set = armorSets?.find(item => item.id === $('gear-set').value);
    if (!set) {
      renderArmorSets();
      return;
    }
    ++gearMemberVersion;
    setup.wear = setup.wear.filter(piece => piece.game !== set.game || piece.kind !== 'armor');
    setup.armorSet[set.game] = set.id;
    setup.clearArmor[set.game] = false;
    const update = beginGearUpdate({game: set.game, label: set.name});
    update.building = true;
    previewGear(set.game);
  });
  async function searchGear() {
    renderArmorSets();
    const version = ++gearVersion;
    ++gearMemberVersion;
    if (gearUpdate && !gearUpdate.building) {
      gearUpdate = null;
      showGearFeedback('', '');
    }
    $('gear-member').hidden = true;
    $('gear-palette-field').hidden = true;
    gearPalettes = [];
    $('gear-results').replaceChildren();
    $('gear-count').textContent = 'Searching…';
    const kind = $('gear-kind').value;
    const slot = $('gear-slot');
    const armor = kind === 'armor';
    $('gear-slot-label').textContent = armor ? 'Armor slot' : 'Weapon type';
    const params = new URLSearchParams({game: $('gear-game').value, kind,
                                       q: $('gear-search').value, page: gearPage});
    if (slot.value) params.set(armor ? 'armor_region' : 'weapon_family', slot.value);
    try {
      const [result, sets] = await Promise.all([
        api('/api/catalog', params),
        armorSets ? Promise.resolve(armorSets) : api('/api/armor-sets', new URLSearchParams())
      ]);
      if (version !== gearVersion) return;
      armorSets = sets;
      renderArmorSets();
      const filters = armor ? result.armor_filters : result.weapon_filters;
      const current = slot.value;
      slot.replaceChildren(new Option(armor ? 'All armor slots' : 'All weapon types', ''), ...filters.map(item =>
        new Option(item.label, item.value)));
      slot.value = filters.some(item => item.value === current) ? current : '';
      gearRows = result.items;
      $('gear-previous').disabled = gearPage === 0;
      $('gear-next').disabled = (gearPage + 1) * 40 >= result.total;
      $('gear-count').textContent = `${result.total.toLocaleString()} items`;
      options($('gear-results'), gearRows.map((item, index) => ({
        key: String(index),
        name: item.label || item.shared ? describe(item) + ' · ' + item.name.split('/').pop().split('.mesh.')[0] : describe(item)
      })));
      Array.from($('gear-results').options).forEach((option, index) => {
        option.title = (gearRows[index].aliases || []).join(', ');
      });
      $('gear-results').selectedIndex = -1;
    } catch (error) {
      if (version === gearVersion) $('gear-count').textContent = error.message;
    }
  }
  async function selectGear() {

        if (saved.gear?.clearWeapon?.[game] === true) setup.clearWeapon[game] = true;
      }
      setup.wear = armor.map(restore).filter(Boolean);
      updateTokens();
      const missing = armor.length - setup.wear.length +
        outfitSlots.filter(slot => saved.slots?.[slot] && !setup[slot]).length;
      if ($('outfit').children.length || missing || Object.keys(setup.armorSet).length ||
          Object.keys(setup.clearArmor).length || Object.keys(setup.clearWeapon).length) $('equipment').open = true;
      if (missing) showGearFeedback('Some saved equipment is unavailable in the current asset catalog.', 'error');
      outfitReady = true;
      await select({id: 0, game: 'DDON', kind: 'animation', name: 'Fighter attack study'});
    } catch (error) {
      $('viewer-empty').textContent = 'Could not restore the saved equipment. ' + error.message;
    } finally {
      sidebar.inert = false;
    }
  }
  startLibrary();
</script>
