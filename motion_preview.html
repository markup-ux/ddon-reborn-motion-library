<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDON Reborn Motion Preview</title>
<style>
  :root { color-scheme: dark; font: 15px system-ui, sans-serif; background: #10141c; color: #edf2fa; }
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; display: flex; padding: 22px clamp(14px, 2vw, 36px); }
  main { display: flex; flex: 1; flex-direction: column; min-width: 0; }
  h1 { font-size: clamp(1.5rem, 3vw, 2.2rem); margin: 0 0 6px; letter-spacing: -.04em; }
  h2 { font-size: 15px; margin: 0; }
  p { color: #aeb9cb; margin: 0; }
  #notice { margin-top: 8px; color: #ffbd71; }
  .toolbar { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; margin: 22px 0 14px; }
  .timeline { flex: 1 1 230px; display: flex; align-items: center; gap: 12px; }
  .timeline input { flex: 1; min-width: 0; accent-color: #ffbd71; }
  .timeline .scrubber { display: grid; flex: 1; min-width: 0; gap: 4px; }
  .scrubber input { width: 100%; margin: 0; }
  #fx-range { height: 3px; margin: 0 7px; }
  #fx-jump { border-color: #5a91a4; color: #b1efff; }
  button, select { font: inherit; color: inherit; border: 1px solid #46546b; background: #202a39;
    padding: 7px 11px; border-radius: 6px; cursor: pointer; }
  #zoom { width: 94px; accent-color: #ffbd71; vertical-align: middle; }
  #play { min-width: 5.4em; background: #ffbd71; color: #211509; border-color: #ffbd71; font-weight: 700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #ffbd71; outline-offset: 3px; }
  #readout { min-width: 8.4em; color: #bbc6d8; font-variant-numeric: tabular-nums; text-align: right; }
  #panels { display: grid; flex: 1; grid-template-columns: repeat(auto-fit, minmax(min(270px, 100%), 1fr)); gap: 12px; }
  article { display: flex; flex-direction: column; min-width: 0; border: 1px solid #354258; border-radius: 9px; overflow: hidden; background: #161d29; }
  article header { padding: 13px 15px; border-bottom: 1px solid #354258; }
  .viewport { position: relative; flex: 1; min-height: clamp(284px, 48vh, 450px); }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.mesh { pointer-events: none; }
  [hidden] { display: none !important; }
  canvas:active { cursor: grabbing; }
  footer { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: .9rem; margin-top: 13px; }
  #equipment-report { margin-top: 12px; }
  #equipment-report summary { cursor: pointer; }
  #equipment-report > p { margin-top: 8px; }
  #equipment-report .inventory-row { padding: 7px 0; border-top: 1px solid #354258; }
  #equipment-report .inventory-row summary { overflow-wrap: anywhere; }
  #equipment-report .inventory-row p { margin: 4px 0 0 14px; overflow-wrap: anywhere; }
  #equipment-report h2 { margin: 14px 0 7px; }
  .right { color: #ffbd71; } .left { color: #83c9ff; }
</style>
<main>
  <h1 id="preview-title">DDON Reborn Motion Preview</h1>
  <p id="summary"></p>
  <p id="notice" hidden></p>
  <div class="toolbar">
    <button id="play" type="button">Play</button>
    <label id="loop-control"><input id="loop" type="checkbox"> Loop clip</label>
    <label class="timeline">Frame <span class="scrubber"><input id="timeline" type="range" min="0" step="1"><span id="fx-range" hidden></span></span></label>
    <button id="fx-jump" type="button" hidden>Jump to FX</button>
    <output id="readout" aria-live="off"></output>
    <label>Speed <select id="speed"><option value="0.25">¼×</option><option value="0.5" selected>½×</option><option value="1">1×</option></select></label>
    <label>View <select id="mode"><option value="mesh">Models</option><option value="both">Models + joints</option><option value="rig">Joints</option></select></label>
    <label>Fallback color <input id="color" type="color" value="#9eb3d3"></label>
    <label><input id="textures" type="checkbox" checked> Textures</label>
    <label><input id="in-place" type="checkbox" checked> In place</label>
    <label id="fire-hand-control" hidden>DD2 hand FX <select id="fire-hand"><option value="flame">Small flame</option><option value="original">Original charge</option></select></label>
    <label id="cage-color-control" hidden>DD2 cage color <input id="cage-color" type="color" value="#ff8a38"></label>
    <label>Zoom <input id="zoom" type="range" min="50" max="500" value="100" step="5" aria-label="Zoom"></label>
    <button id="reset" type="button">Reset view</button>
  </div>
  <div id="panels"></div>
  <footer>
    <span class="right">Right limbs</span><span class="left">Left limbs</span>
    <p>Scroll to zoom, drag to rotate, or Shift-drag to pan. Both views move together.</p>
  </footer>
  <details id="equipment-report" hidden>
    <summary>Equipment check</summary>
    <p>Mesh and material checks use local game resources and saved equipment. Exact colors in the running game also depend on dyes, shaders, and lighting.</p>
    <div id="equipment-report-items"></div>
  </details>
</main>
<script id="motion-data" type="application/json">__MOTION_DATA__</script>
<script>
  'use strict';
  const data = JSON.parse(document.querySelector('#motion-data').textContent);
  document.querySelector('#preview-title').textContent = data.heading || data.clip;
  const timeline = document.querySelector('#timeline');
  const readout = document.querySelector('#readout');
  const play = document.querySelector('#play');
  const loop = document.querySelector('#loop');
  const speed = document.querySelector('#speed');
  const inPlace = document.querySelector('#in-place');
  const mode = document.querySelector('#mode');
  const color = document.querySelector('#color');
  const texturesEnabled = document.querySelector('#textures');
  const last = data.frames.length - 1;
  const timeAt = index => data.times?.[index] ?? data.frames[index] / data.fps;
  function frameAt(time) {
    let low = 0, high = last + 1;
    while (low < high) {
      const trial = Math.floor((low + high) / 2);
      if (timeAt(trial) <= time) low = trial + 1;
      else high = trial;
    }
    return Math.max(0, low - 1);
  }
  const transition = data.transition;
  const effect = data.effect;
  const fireHand = document.querySelector('#fire-hand');
  const cageColor = document.querySelector('#cage-color');
  if (data.views.some(view => view.fire_tuning)) {
    document.querySelector('#fire-hand-control').hidden = !effect?.cast?.flame;
    document.querySelector('#cage-color-control').hidden = !effect?.cage_color;
    if (effect?.cage_color) cageColor.value = effect.cage_color;
  }
  const fx = effect || data.views.find(view => view.fx)?.fx;
  const fxRanges = fx?.ranges || (fx ? [[fx.start, fx.end]] : []);
  const activeRange = index => fxRanges.find(([start, end]) => index >= start && index <= end);
  const fxJump = document.querySelector('#fx-jump');
  if (fx && !effect?.solo) {
    fxJump.hidden = false;
    const track = document.querySelector('#fx-range');
    track.hidden = false;
    const stops = fxRanges.flatMap(([start, end]) => {
      const from = 100 * start / (last + 1) + '%';
      const to = 100 * (end + 1) / (last + 1) + '%';
      return [`transparent ${from}`, `#71e4ff ${from} ${to}`, `transparent ${to}`];
    });
    track.style.background = `linear-gradient(to right, ${stops.join(', ')})`;
  }
  const motionEnd = effect?.mesh ? effect.pose_count - 1 : last;
  const actionDuration = timeAt(transition?.end ?? motionEnd) - timeAt(transition?.start ?? 0);
  if (transition || effect) speed.value = '1';
  if (effect?.solo) {
    for (const control of [mode, color, texturesEnabled, inPlace]) control.closest('label').hidden = true;
    document.querySelector('footer').hidden = true;
  }
  loop.checked = !transition;
  document.querySelector('#loop-control').hidden = last === 0;
  timeline.max = last;
  timeline.value = 0;
  play.disabled = last === 0;
  document.querySelector('#summary').textContent =
    `${data.clip} · ${Math.round(data.fps * 100) / 100} fps · ${actionDuration.toFixed(3)} s`;
  const notice = document.querySelector('#notice');
  notice.textContent = data.note || '';
  notice.hidden = !data.note;
  const textureLoads = [];
  function loadSprite(layer) {
    if (!layer?.image) return;
    const image = new Image();
    image.src = layer.image;
    textureLoads.push(image.decode().catch(() => {
      notice.textContent = 'The effect sprite could not load.';
      notice.hidden = false;
    }));
    return image;
  }
  const effectImage = loadSprite(effect);
  const castImage = loadSprite(effect?.cast);
  const flameImage = loadSprite(effect?.cast?.flame);
  const panels = data.views.map(view => {
    const pane = document.createElement('article');
    const header = pane.appendChild(document.createElement('header'));
    const title = header.appendChild(document.createElement('h2'));
    title.textContent = view.label;
    const viewport = pane.appendChild(document.createElement('div'));
    viewport.className = 'viewport';
    const surface = viewport.appendChild(document.createElement('canvas'));
    surface.className = 'mesh';
    const orbSurface = effect?.mesh && viewport.appendChild(document.createElement('canvas'));
    if (orbSurface) {
      orbSurface.className = 'mesh effect-mesh';
      orbSurface.hidden = true;
    }
    const canvas = viewport.appendChild(document.createElement('canvas'));
    canvas.setAttribute('aria-label', `Preview of ${view.label}`);
    document.querySelector('#panels').append(pane);
    return { view, canvas, surface, orbSurface, ctx: canvas.getContext('2d') };
  });
  for (const panel of panels) {
    if (!panel.view.mesh) continue;
    try { panel.model = createModel(panel.surface, panel.view.mesh); }
    catch (error) { console.warn('Character geometry unavailable', error); }
  }
  if (effect?.mesh) {
    for (const panel of panels) {
      try { panel.orb = createModel(panel.orbSurface, effect.mesh, true); }
      catch (error) { console.warn('Effect geometry unavailable', error); }
    }
  }
  if (!panels.some(panel => panel.model)) mode.value = 'rig';

  for (const {view} of panels) {
    const check = view.equipment;
    if (!check) continue;
    const container = document.querySelector('#equipment-report-items');
    document.querySelector('#equipment-report').hidden = false;
    const section = container.appendChild(document.createElement('section'));
    section.appendChild(document.createElement('h2')).textContent = check.game + ' · ' + check.reference;
    for (const row of check.rows) {
      const item = section.appendChild(document.createElement('details'));
      item.className = 'inventory-row';
      item.appendChild(document.createElement('summary')).textContent =
        [row.name, row.mesh_status, row.variant_status, row.overrides?.length && 'Installed override found']
          .filter(Boolean).join(' · ');
      const info = [
        row.mesh && 'Preview mesh ' + row.mesh,
        row.expected && 'Saved mesh ' + row.expected.mesh,
        row.expected?.material && 'Saved variant ' + row.expected.material,
        row.materials?.length && 'Loaded materials ' + row.materials.join(', '),
        row.groups && 'Base color textures on ' + row.mapped + ' of ' + row.groups + ' rendered mesh parts',
        row.textures?.length && 'Loaded color textures ' + row.textures.join(', '),
        row.overrides?.length && 'Installed overrides ' + row.overrides.join(', '),
      ];
      for (const line of info.filter(Boolean)) item.appendChild(document.createElement('p')).textContent = line;
    }
  }

  function bytes(value) {
    if (Uint8Array.fromBase64) return Uint8Array.fromBase64(value);
    const raw = atob(value);
    const result = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) result[i] = raw.charCodeAt(i);
    return result;
  }

  let textureRedraw = null;
  function scheduleTextureRedraw() {
    if (textureRedraw !== null) return;
    textureRedraw = requestAnimationFrame(() => {
      textureRedraw = null;
      display();
    });
  }

  function sampleEffectTrack(keys, tick, fallback, repeat = false) {
    if (!keys?.length) return fallback;
    const lastKey = keys.at(-1);
    const time = repeat ? tick % lastKey[0] : tick;
    const next = keys.findIndex(key => key[0] > time);
    if (next < 0) return lastKey.slice(1);
    if (next === 0) return keys[0].slice(1);
    const a = keys[next - 1], b = keys[next];
    const fraction = (time - a[0]) / (b[0] - a[0]);
    return a.slice(1).map((value, i) => value + (b[i + 1] - value) * fraction);
  }
  function createModel(canvas, mesh, effectModel = false) {
    const gl = canvas.getContext('webgl2', { alpha: true, antialias: true });
    if (!gl) return null;
    const program = gl.createProgram();
    function shader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(shader));
      gl.attachShader(program, shader);
    }
    shader(gl.VERTEX_SHADER, `#version 300 es
      in vec3 position;
      in vec2 uv;
      in vec3 tint;
      in vec3 surfaceNormal;
      uniform vec2 yaw, pitch, scale, origin, pan, spin;
      uniform float pivotY, layerScale;
      out vec3 point;
      out vec2 coordinates;
      out vec3 vertexColor;
      out vec3 smoothDirection;
      void main() {
        vec3 rotated = vec3(position.x * spin.x - position.z * spin.y, position.y,
          position.x * spin.y + position.z * spin.x);
        vec3 p = rotated * (layerScale / 1000.0) - vec3(origin.x, pivotY, origin.y);
        float depth = yaw.y * p.x + yaw.x * p.z;
        point = vec3(yaw.x * p.x - yaw.y * p.z, pitch.x * p.y - pitch.y * depth,
          pitch.y * p.y + pitch.x * depth);
        gl_Position = vec4(point.xy * scale + pan, -0.08 * point.z, 1.0);
        coordinates = uv;
        vertexColor = tint;
        float normalDepth = yaw.y * surfaceNormal.x + yaw.x * surfaceNormal.z;
        smoothDirection = vec3(yaw.x * surfaceNormal.x - yaw.y * surfaceNormal.z,
          pitch.x * surfaceNormal.y - pitch.y * normalDepth,
          pitch.y * surfaceNormal.y + pitch.x * normalDepth);
      }`);
    shader(gl.FRAGMENT_SHADER, `#version 300 es
      precision highp float;
      in vec3 point;
      in vec2 coordinates;
      in vec3 vertexColor;
      in vec3 smoothDirection;
      uniform vec3 shade;
      uniform sampler2D diffuse, bump, surface;
      uniform bool hasMap, hasNormal, hasSurface, effectModel, useVertexTint;
      uniform float opacity, emission;
      uniform vec2 finish;
      out vec4 pixel;
      void main() {
        vec3 dx = dFdx(point), dy = dFdy(point);
        vec2 ux = dFdx(coordinates), uy = dFdy(coordinates);
        vec3 normal = normalize(cross(dx, dy));
        if (dot(smoothDirection, smoothDirection) > 0.01) {
          vec3 smoothNormal = normalize(smoothDirection);
          normal = dot(normal, smoothNormal) < 0.0 ? -smoothNormal : smoothNormal;
        }
        float det = ux.x * uy.y - ux.y * uy.x;
        if (hasNormal && abs(det) > 1e-10) {
          vec3 tangent = normalize(sign(det) * (dx * uy.y - dy * ux.y));
          tangent = normalize(tangent - normal * dot(normal, tangent));
          vec3 bitangent = sign(det) * cross(normal, tangent);
          vec2 xy = texture(bump, coordinates).rg * 2.0 - 1.0;
          normal = normalize(mat3(tangent, bitangent, normal) * vec3(xy, sqrt(max(1.0 - dot(xy, xy), 0.0))));
        }
        vec4 albedo = hasMap ? texture(diffuse, coordinates) : vec4(1.0);
        if (effectModel) {
          float intensity = mix(0.25, 1.0, dot(albedo.rgb, vec3(0.299, 0.587, 0.114)));
          vec3 lit = max(vec3(0.0), pow(shade, vec3(1.0 / 2.2)) * vertexColor * intensity);
          pixel = vec4(mix(lit, sqrt(lit), emission), albedo.a * opacity);
          return;
        }
        if (albedo.a < 0.5) discard;

        vec3 light = normalize(vec3(-0.45, 0.65, 1.0));
        float facing = max(dot(normal, light), 0.0);
        vec3 tint = useVertexTint ? vertexColor : vec3(1.0);
        vec3 base = pow(albedo.rgb, vec3(2.2)) * tint * shade;
        vec3 result = base * (0.39 + 0.61 * facing);
        if (hasSurface) {
          vec3 masks = texture(surface, coordinates).rgb;
          float metal = clamp(masks.r * finish.x, 0.0, 1.0);
          float roughness = clamp(masks.g * finish.y, 0.08, 1.0);
          vec3 halfway = normalize(light + vec3(0.0, 0.0, 1.0));
          float glint = pow(max(dot(normal, halfway), 0.0), mix(110.0, 4.0, roughness));
          vec3 reflectance = mix(vec3(0.028), base, metal);
          float indirect = mix(0.29, 0.53, masks.b);
          result = base * (indirect + (1.0 - metal) * 0.46 * facing)
                 + reflectance * glint * facing * mix(1.05, 0.18, roughness);
        }
        pixel = vec4(pow(max(result, vec3(0.0)), vec3(1.0 / 2.2)), 1.0);
      }`);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const places = Object.fromEntries([
      'yaw', 'pitch', 'scale', 'origin', 'pan', 'spin', 'pivotY', 'layerScale', 'effectModel', 'opacity', 'emission', 'shade', 'hasMap', 'diffuse',
      'hasNormal', 'bump', 'hasSurface', 'surface', 'finish', 'useVertexTint',
    ].map(
      key => [key, gl.getUniformLocation(program, key)]));
    const attribute = gl.getAttribLocation(program, 'position');
    const poses = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, poses);
    gl.bufferData(gl.ARRAY_BUFFER, bytes(mesh.poses), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(attribute);
    function attributeData(name, data, size, type, normalized) {
      const location = gl.getAttribLocation(program, name);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(location);
      gl.vertexAttribPointer(location, size, type, normalized, 0, 0);
    }
    attributeData('uv', mesh.uv ? bytes(mesh.uv) : new Float32Array(mesh.vertices * 2), 2, gl.FLOAT, false);
    attributeData('tint', mesh.colors ? bytes(mesh.colors) : new Uint8Array(mesh.vertices * 3).fill(255),
                  3, gl.UNSIGNED_BYTE, true);
    const smoothNormals = (mesh.smooth_normals || []).map(part => ({...part, data: bytes(part.data)}));
    let normalsBuffer;
    if (smoothNormals.length) {
      const location = gl.getAttribLocation(program, 'surfaceNormal');
      normalsBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, normalsBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, mesh.vertices * 3, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(location);
      gl.vertexAttribPointer(location, 3, gl.BYTE, true, 0, 0);
    }
    let normalsFrame = -1;
    const faces = bytes(mesh.faces);
    const indices = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indices);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, faces, gl.STATIC_DRAW);
    gl.enable(gl.DEPTH_TEST);
    gl.uniform1i(places.effectModel, effectModel);
    if (effectModel) {
      gl.enable(gl.BLEND);
      gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    }
    gl.clearColor(0, 0, 0, 0);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    const white = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, white);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
                  new Uint8Array([255, 255, 255, 255]));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    const cachedMaps = (mesh.images || []).map(uri => {
      const map = { texture: gl.createTexture(), ready: false };
      const image = new Image();
      textureLoads.push(new Promise(resolve => {
        image.onerror = resolve;
        image.onload = () => {
          try {
            gl.bindTexture(gl.TEXTURE_2D, map.texture);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.generateMipmap(gl.TEXTURE_2D);
            map.ready = true;
            scheduleTextureRedraw();
          } finally {
            resolve();
          }
        };
        image.src = uri;
      }));
      return map;
    });
    const groups = mesh.groups || [{ start: 0, count: faces.length / 4, base: [1, 1, 1], image: null }];
    return function render(frame, width, height, scale, base, xCos, xSin, yCos, ySin, pivotY = .91, angle = 0, cageTint = null) {
      const ratio = devicePixelRatio || 1;
      if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
      }
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.depthMask(true);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.uniform2f(places.yaw, xCos, xSin);
      gl.uniform2f(places.pitch, yCos, ySin);
      gl.uniform2f(places.scale, 2 * scale / width, 2 * scale / height);
      gl.uniform2f(places.origin, base[0], base[2]);
      gl.uniform1f(places.pivotY, pivotY);
      gl.uniform2f(places.spin, 1, 0);
      gl.uniform1f(places.layerScale, 1);
      gl.uniform2f(places.pan, camera.panX * 2, -camera.panY * 2);
      const useTextures = texturesEnabled.checked;
      const fallback = [1, 3, 5].map(i => (parseInt(color.value.slice(i, i + 2), 16) / 255) ** 2.2);
      gl.uniform1i(places.useVertexTint, useTextures);
      gl.bindBuffer(gl.ARRAY_BUFFER, poses);
      gl.vertexAttribPointer(attribute, 3, gl.SHORT, false, 6, frame * mesh.vertices * 6);
      if (normalsBuffer && normalsFrame !== frame) {
        gl.bindBuffer(gl.ARRAY_BUFFER, normalsBuffer);
        for (const part of smoothNormals)
          gl.bufferSubData(gl.ARRAY_BUFFER, part.offset, part.data.subarray(frame * part.stride, (frame + 1) * part.stride));
        normalsFrame = frame;
      }
      gl.uniform1i(places.diffuse, 0);
      gl.uniform1i(places.bump, 1);
      gl.uniform1i(places.surface, 2);
      function bindMap(slot, image) {
        const map = cachedMaps[image];
        const enabled = Boolean(useTextures && map?.ready);
        gl.activeTexture(gl.TEXTURE0 + slot);
        gl.bindTexture(gl.TEXTURE_2D, enabled ? map.texture : white);
        return enabled;
      }
      for (const group of groups) {
        if (group.visible && (frame < group.visible[0] || frame > group.visible[1])) continue;
        const textured = bindMap(0, group.image);
        gl.uniform1i(places.hasMap, textured);
        gl.uniform1i(places.hasNormal, bindMap(1, group.normal));
        const surfaced = bindMap(2, group.surface);
        gl.uniform1i(places.hasSurface, textured && surfaced);
        gl.uniform2f(places.finish, group.metallic ?? 1, group.roughness ?? 1);
        if (effectModel && group.fx) {
          const tick = angle * 30;
          const config = group.fx;
          const [r, g, b, a] = sampleEffectTrack(config.color, tick, config.rgba, true);
          const [scale] = sampleEffectTrack(config.scale, tick, [1]);
          const rotation = tick * config.spin;
          const brightness = config.brightness ?? 1;
          gl.uniform3fv(places.shade, [r, g, b].map((channel, index) => {
            const tint = config.cage && cageTint ? cageTint : config.tint;
            const tinted = tint ? channel * .45 + tint[index] * .55 : channel;
            return (tinted * brightness / 255) ** 2.2;
          }));
          gl.uniform1f(places.opacity, a / 255 * (config.opacity_scale ?? 1));
          gl.uniform1f(places.emission, config.cage && cageTint ? .52 : config.emission ?? 0);
          gl.uniform1f(places.layerScale, Math.max(scale, config.scale_floor ?? 0));
          gl.uniform2f(places.spin, Math.cos(rotation), Math.sin(rotation));
          gl.depthMask(config.depth_write ?? a >= 252);
        } else {
          const useBase = (effectModel || useTextures) && (textured || group.base.some(value => value !== 1));
          gl.uniform3fv(places.shade, useBase ? group.base : fallback);
        }
        gl.drawElements(gl.TRIANGLES, group.count, gl.UNSIGNED_INT, group.start * 4);
      }
    };
  }

  const defaults = { yaw: -0.42, pitch: 0.13, zoom: 1, panX: 0, panY: 0 };
  const camera = { ...defaults };
  const zoomControl = document.querySelector('#zoom');
  window.getPreviewCamera = () => ({...camera});
  window.setPreviewCamera = state => {
    if (!state) return;
    for (const key of Object.keys(defaults)) if (Number.isFinite(state[key])) camera[key] = state[key];
    display();
  };
  function setZoom(value, x = 0, y = 0) {
    const next = Math.min(5, Math.max(0.5, value));
    const factor = next / camera.zoom;
    camera.panX = x + (camera.panX - x) * factor;
    camera.panY = y + (camera.panY - y) * factor;
    camera.zoom = next;
    display();
  }
  let frame = 0, playbackFrame = 0, startedAt = null, playing = false, animationRequest = null;
  function resize(panel) {
    const { canvas, ctx } = panel;
    const width = canvas.clientWidth, height = canvas.clientHeight, ratio = devicePixelRatio || 1;
    if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
    }
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    return { width, height };
  }

  function draw(panel) {
    const { view, ctx } = panel;
    const { width, height } = resize(panel);
    if (!width || !height) return;
    const scale = Math.min(width / (view.span || 2.55), height / 2.18) * camera.zoom;
    const poseFrame = Math.min(frame, (effect?.pose_count ?? data.frames.length) - 1);
    const root = inPlace.checked ? view.root[poseFrame] : view.root[0];
    const base = [root[0] + (view.centerX || 0), root[1], root[2]];
    const xCos = Math.cos(camera.yaw), xSin = Math.sin(camera.yaw);
    const yCos = Math.cos(camera.pitch), ySin = Math.sin(camera.pitch);
    function project([x, y, z]) {
      const dx = x - base[0], dz = z - base[2], dy = y - 0.91;
      return [width * (0.5 + camera.panX) + scale * (xCos * dx - xSin * dz),
        height * (0.5 + camera.panY) - scale * (yCos * dy - ySin * (xSin * dx + xCos * dz))];
    }
    function line(a, b, color, width) {
      ctx.strokeStyle = color; ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(...project(a)); ctx.lineTo(...project(b)); ctx.stroke();
    }
    ctx.clearRect(0, 0, width, height);
    panel.surface.hidden = mode.value === 'rig' || !panel.model;
    if (!panel.surface.hidden) panel.model(poseFrame, width, height, scale, base, xCos, xSin, yCos, ySin);
    ctx.lineCap = 'round';
    for (let i = -4; i <= 4; i++) {
      const d = i / 4;
      line([base[0] + d, 0, base[2] - 1], [base[0] + d, 0, base[2] + 1], '#2d394b', 1);
      line([base[0] - 1, 0, base[2] + d], [base[0] + 1, 0, base[2] + d], '#2d394b', 1);
    }
    if (view.fx && frame >= view.fx.start && frame <= view.fx.end) {
      const [x, y] = project(view.fx.anchor[frame]);
      ctx.strokeStyle = '#71e4ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, Math.max(11, scale * 0.07), 0, 2 * Math.PI); ctx.stroke();
    }
    const range = activeRange(frame);
    const releaseIndex = effect?.release?.findIndex(([start, end]) => frame >= start && frame <= end) ?? -1;
    const orbOrigin = view.orb_origins?.[releaseIndex];
    if (panel.orbSurface) {
      panel.orbSurface.hidden = !panel.orb || !orbOrigin;
      if (!panel.orbSurface.hidden) {
        const [x, y, z] = orbOrigin;
        const cageTint = view.fire_tuning && effect.cage_color
          ? [1, 3, 5].map(index => parseInt(cageColor.value.slice(index, index + 2), 16)) : null;
        panel.orb(0, width, height, scale, [base[0] - x, 0, base[2] - z], xCos, xSin, yCos, ySin,
          .91 - y, timeAt(frame) - timeAt(effect.release[releaseIndex][0]), cageTint);
      }
    }
    function drawSprite(layer, image, origin, start, fade = false, repeat = false) {
      if (!image?.naturalWidth || !origin) return;
      const elapsed = timeAt(frame) - timeAt(start);
      const duration = layer.cells.length / layer.fps;
      if (elapsed < 0 || (fade && elapsed >= duration)) return;
      const tick = Math.floor(elapsed * layer.fps + 1e-7);
      const cellIndex = repeat ? tick % layer.cells.length : Math.min(layer.cells.length - 1, tick);
      const [u, v, right, bottom] = layer.cells[cellIndex];
      const [x, y] = project(origin);
      const sourceWidth = (right - u) * image.naturalWidth;
      const sourceHeight = (bottom - v) * image.naturalHeight;
      const aspect = sourceWidth / sourceHeight;
      const size = scale * layer.size;
      const spriteWidth = size * Math.min(1, aspect);
      const spriteHeight = size / Math.max(1, aspect);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (layer.opacity ?? 1) * (fade ? (1 - elapsed / duration) * .8 : 1);
      ctx.drawImage(image, u * image.naturalWidth, v * image.naturalHeight,
        sourceWidth, sourceHeight, x - spriteWidth / 2, y - spriteHeight / 2, spriteWidth, spriteHeight);
      ctx.restore();
    }
    function drawGlow(origin, rgb, radius, strength) {
      if (!origin) return;
      const [x, y] = project(origin);
      const glow = ctx.createRadialGradient(x, y, 0, x, y, radius);
      glow.addColorStop(0, `rgba(255,255,255,${strength})`);
      glow.addColorStop(.07, `rgba(255,255,255,${strength * .95})`);
      glow.addColorStop(.19, `rgba(${rgb},${strength * .86})`);
      glow.addColorStop(.42, `rgba(${rgb},${strength * .29})`);
      glow.addColorStop(1, `rgba(${rgb},0)`);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = glow;
      ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
      ctx.restore();
    }
    if (orbOrigin) {
      const release = effect.release[releaseIndex][0];
      drawSprite(effect, effectImage, orbOrigin, release, true);
      if (effect.glow) {
        const elapsed = timeAt(frame) - timeAt(release);
        const flash = Math.max(0, 1 - elapsed / .36);
        const pulse = .05 * Math.sin(elapsed * 10);
        drawGlow(orbOrigin, effect.glow, scale * (.45 + flash * .30), .81 + pulse + flash * .14);
      }
    } else if (range && !effect?.mesh && !effect?.cast) {
      drawSprite(effect, effectImage, view.effect_anchor?.[poseFrame], range[0]);
    }
    const casting = effect?.cast?.ranges.find(([start, end]) => frame >= start && frame <= end);
    const flameRange = view.fire_tuning && flameImage?.naturalWidth && fireHand.value === 'flame'
      ? effect.cast.flame.ranges.find(([start, end]) => frame >= start && frame <= end) : null;
    if (flameRange) {
      drawSprite(effect.cast.flame, flameImage, view.cast_anchor?.[poseFrame], flameRange[0], false, true);
    } else if (casting) {
      const hand = view.cast_anchor?.[poseFrame];
      const elapsed = timeAt(frame) - timeAt(casting[0]);
      drawSprite(effect.cast, castImage, hand, casting[0]);
      drawGlow(hand, effect.cast.glow, scale * .28, .52 + .20 * Math.exp(-7 * elapsed));
    }
    if (mode.value === 'mesh' && panel.model) return;
    const points = view.positions?.[poseFrame];
    if (!points) return;
    for (const [label, chain] of data.chains) {
      const color = label.startsWith('Right') ? '#ffbd71' : label.startsWith('Left') ? '#83c9ff' : '#d6dce8';
      for (let i = 1; i < chain.length; i++) line(points[chain[i - 1]], points[chain[i]], color, 3.2);
      ctx.fillStyle = color;
      for (const i of chain) {
        ctx.beginPath(); ctx.arc(...project(points[i]), 3.3, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (view.grip) {
      const grip = view.grip[poseFrame], origin = grip.map(row => row[3]);
      ['#ff8293', '#89dfa4', '#97b3ff'].forEach((color, axis) => {
        line(origin, grip.map(row => row[3] + row[axis] * 0.14), color, 2);
      });
    }
  }

  function display() {
    zoomControl.value = Math.round(camera.zoom * 100);
    zoomControl.setAttribute('aria-valuetext', Math.round(camera.zoom * 100) + '%');
    const stage = data.stages?.find(stage => frame >= stage.start && frame <= stage.end);
    const hold = effect?.mesh && frame >= effect.pose_count;
    const phase = hold ? 'Lingering FX' : stage?.name ||
      (transition && (frame < transition.start ? 'Lead-in' : frame > transition.end ? 'Recovery' : 'Action'));
    const showFX = Boolean(activeRange(frame));
    readout.value = `${phase ? phase + ' · ' : ''}${data.frames[frame]} / ${data.frames[last]} · ${timeAt(frame).toFixed(3)} s${showFX ? ' · FX' : ''}`;
    timeline.value = frame;
    panels.forEach(draw);
  }
  const loopStart = transition?.start ?? 0;
  const effectLoopEnd = effect?.mesh ? 0 : effect?.end ?? 0;
  const loopEnd = transition ? Math.max(transition.end, effectLoopEnd) : motionEnd;
  function animate(now) {
    if (!playing) return;
    if (startedAt === null) startedAt = now;
    const elapsed = Math.max(0, now - startedAt);
    const seconds = elapsed * Number(speed.value) / 1000;
    if (data.times) {
      const begin = timeAt(loopStart);
      const end = timeAt(loopEnd) + 1 / data.fps;
      let time = timeAt(playbackFrame) + seconds;
      if (loop.checked && time >= end) time = begin + (time - end) % (end - begin);
      frame = Math.min(loop.checked ? loopEnd : last, frameAt(time));
    } else {
      const next = playbackFrame + Math.floor(seconds * data.fps);
      frame = loop.checked && next > loopEnd
        ? loopStart + (next - loopEnd - 1) % (loopEnd - loopStart + 1)
        : Math.min(next, last);
    }
    display();
    if (!loop.checked && frame === last) stop();
    else animationRequest = requestAnimationFrame(animate);
  }
  function anchorPlayback() {
    playbackFrame = frame;
    startedAt = null;
  }
  function stop() {
    playing = false;
    cancelAnimationFrame(animationRequest);
    play.textContent = 'Play';
  }
  play.addEventListener('click', () => {
    if (playing) return stop();
    if (frame === last) frame = 0;
    else if (loop.checked && frame > loopEnd) frame = loopStart;
    anchorPlayback();
    playing = true;
    play.textContent = 'Pause';
    animationRequest = requestAnimationFrame(animate);
  });
  fxJump.addEventListener('click', () => {
    stop();
    const next = fxRanges.find(([start]) => start > frame) || fxRanges[0];
    if (!next) return;
    frame = next[0];
    display();
  });
  timeline.addEventListener('input', () => { stop(); frame = Number(timeline.value); display(); });
  loop.addEventListener('change', () => {
    if (!playing) return;
    if (loop.checked && frame > loopEnd) frame = loopStart;
    anchorPlayback();
    display();
  });
  speed.addEventListener('change', () => {
    if (playing) anchorPlayback();
  });
  inPlace.addEventListener('change', display);
  mode.addEventListener('change', display);
  color.addEventListener('input', display);
  cageColor.addEventListener('input', display);
  fireHand.addEventListener('change', display);
  texturesEnabled.addEventListener('change', display);
  zoomControl.addEventListener('input', () => setZoom(Number(zoomControl.value) / 100));
  document.querySelector('#reset').addEventListener('click', () => { Object.assign(camera, defaults); display(); });
  for (const { canvas } of panels) {
    let drag = null;
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const bounds = canvas.getBoundingClientRect();
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? bounds.height : 1);
      setZoom(camera.zoom * Math.exp(-delta * 0.0018),
        (event.clientX - bounds.left) / bounds.width - 0.5,
        (event.clientY - bounds.top) / bounds.height - 0.5);
    }, {passive: false});
    canvas.addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      drag = { x: event.clientX, y: event.clientY, pan: event.shiftKey };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', event => {
      if (!drag) return;
      const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
      if (drag.pan) {
        camera.panX += dx / canvas.clientWidth;
        camera.panY += dy / canvas.clientHeight;
      } else {
        camera.yaw += dx * 0.01;
        camera.pitch = Math.max(-1.25, Math.min(1.25, camera.pitch + dy * 0.01));
      }
      drag.x = event.clientX;
      drag.y = event.clientY;
      display();
    });
    canvas.addEventListener('lostpointercapture', () => { drag = null; });
  }
  window.addEventListener('resize', display);
  display();
  window.previewReady = Promise.all(textureLoads).then(() => {
    display();
    return panels.filter(panel => panel.model).map(panel => panel.view.label);
  });
</script>
